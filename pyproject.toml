[project]
name = "delorean"
version = "1.0.1"
description = "library for manipulating datetimes with ease and clarity"
readme = "README.rst"
license = { text = "MIT license" }
authors = [{ name = "Mahdi Yusuf", email = "yusuf.mahdi@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "babel>=2.10.3",
    "humanize>=4.2.2",
    "python-dateutil>=2.8.2",
    "pytz>=2022.1",
    "tzlocal>=4.2",
]

[project.urls]
Homepage = "https://github.com/myusuf3/delorean"

[dependency-groups]
dev = [
    "mock",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["delorean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["delorean_tests.py"]
